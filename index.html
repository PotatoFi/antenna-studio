<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Antenna Studio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="radio-tab-bar" id="radio-tabs"></div>

        <div class="app-container">
            <canvas id="canvas-3d"></canvas>

            <!-- Right Pane -->
            <div class="right-pane" id="right-pane">
                <div class="pane-content" id="edit-pane">
                    <h3>Edit Antenna</h3>

                    <!-- Azimuth Pattern -->
                    <div class="pattern-section">
                        <div class="pattern-header">
                            <span class="color-indicator azimuth"></span>
                            <span>Azimuth / Horizontal / XY</span>
                        </div>
                        <div class="pattern-chart">
                            <canvas id="azimuth-chart"></canvas>
                        </div>
                        <div class="pattern-controls">
                            <button
                                class="toolbar-button paste-btn"
                                data-plane="azimuth"
                            >
                                Paste CSV
                            </button>
                            <div class="rotate-controls">
                                <button
                                    class="toolbar-button rotate-btn"
                                    data-plane="azimuth"
                                    data-direction="ccw"
                                    title="Rotate counter-clockwise by 90°"
                                >
                                    &#8634;
                                </button>
                                <button
                                    class="toolbar-button rotate-btn"
                                    data-plane="azimuth"
                                    data-direction="cw"
                                    title="Rotate clockwise by 90°"
                                >
                                    &#8635;
                                </button>
                            </div>
                            <div class="swap-controls">
                                <button
                                    class="toolbar-button swap-btn"
                                    data-plane="azimuth"
                                    data-target="elevation-xz"
                                    title="Swap this pattern to the XZ plane"
                                >
                                    Swap to XZ
                                </button>
                                <button
                                    class="toolbar-button swap-btn"
                                    data-plane="azimuth"
                                    data-target="elevation-yz"
                                    title="Swap this pattern to the YZ plane"
                                >
                                    Swap to YZ
                                </button>
                            </div>
                        </div>
                        <div class="pattern-controls">
                            <div class="flip-controls">
                                <button
                                    class="toolbar-button flip-btn"
                                    data-plane="azimuth"
                                    data-axis="first"
                                    title="Mirror pattern around X axis"
                                >
                                    Mirror X
                                </button>
                                <button
                                    class="toolbar-button flip-btn"
                                    data-plane="azimuth"
                                    data-axis="second"
                                    title="Mirror pattern around Y axis"
                                >
                                    Mirror Y
                                </button>
                            </div>
                            <button
                                class="toolbar-button delete-btn"
                                data-plane="azimuth"
                                title="Delete this pattern"
                            >
                                Delete
                            </button>
                        </div>
                    </div>

                    <hr />

                    <!-- Elevation XZ Pattern -->
                    <div class="pattern-section">
                        <div class="pattern-header">
                            <span class="color-indicator elevation-xz"></span>
                            <span>Elevation / Vertical / XZ</span>
                        </div>
                        <div class="pattern-chart">
                            <canvas id="elevation-xz-chart"></canvas>
                        </div>
                        <div class="pattern-controls">
                            <button
                                class="toolbar-button paste-btn"
                                data-plane="elevation-xz"
                            >
                                Paste CSV
                            </button>
                            <div class="rotate-controls">
                                <button
                                    class="toolbar-button rotate-btn"
                                    data-plane="elevation-xz"
                                    data-direction="ccw"
                                    title="Rotate counter-clockwise by 90°"
                                >
                                    &#8634;
                                </button>
                                <button
                                    class="toolbar-button rotate-btn"
                                    data-plane="elevation-xz"
                                    data-direction="cw"
                                    title="Rotate clockwise by 90°"
                                >
                                    &#8635;
                                </button>
                            </div>
                            <div class="swap-controls">
                                <button
                                    class="toolbar-button swap-btn"
                                    data-plane="elevation-xz"
                                    data-target="azimuth"
                                    title="Swap this pattern to the XY plane"
                                >
                                    Swap to XY
                                </button>
                                <button
                                    class="toolbar-button swap-btn"
                                    data-plane="elevation-xz"
                                    data-target="elevation-yz"
                                    title="Swap this pattern to the YZ plane"
                                >
                                    Swap to YZ
                                </button>
                            </div>
                        </div>
                        <div class="pattern-controls">
                            <div class="flip-controls">
                                <button
                                    class="toolbar-button flip-btn"
                                    data-plane="elevation-xz"
                                    data-axis="first"
                                    title="Mirror pattern around X axis"
                                >
                                    Mirror X
                                </button>
                                <button
                                    class="toolbar-button flip-btn"
                                    data-plane="elevation-xz"
                                    data-axis="second"
                                    title="Mirror pattern around Z axis"
                                >
                                    Mirror Z
                                </button>
                            </div>
                            <button
                                class="toolbar-button delete-btn"
                                data-plane="elevation-xz"
                                title="Delete this pattern"
                            >
                                Delete
                            </button>
                        </div>
                    </div>

                    <hr />

                    <!-- Elevation YZ Pattern -->
                    <div class="pattern-section">
                        <div class="pattern-header">
                            <span class="color-indicator elevation-yz"></span>
                            <span>Elevation / Vertical / YZ</span>
                        </div>
                        <div class="pattern-chart">
                            <canvas id="elevation-yz-chart"></canvas>
                        </div>
                        <div class="pattern-controls">
                            <button
                                class="toolbar-button paste-btn"
                                data-plane="elevation-yz"
                            >
                                Paste CSV
                            </button>
                            <div class="rotate-controls">
                                <button
                                    class="toolbar-button rotate-btn"
                                    data-plane="elevation-yz"
                                    data-direction="ccw"
                                    title="Rotate counter-clockwise by 90°"
                                >
                                    &#8634;
                                </button>
                                <button
                                    class="toolbar-button rotate-btn"
                                    data-plane="elevation-yz"
                                    data-direction="cw"
                                    title="Rotate clockwise by 90°"
                                >
                                    &#8635;
                                </button>
                            </div>
                            <div class="swap-controls">
                                <button
                                    class="toolbar-button swap-btn"
                                    data-plane="elevation-yz"
                                    data-target="azimuth"
                                    title="Swap this pattern to the XY plane"
                                >
                                    Swap to XY
                                </button>
                                <button
                                    class="toolbar-button swap-btn"
                                    data-plane="elevation-yz"
                                    data-target="elevation-xz"
                                    title="Swap this pattern to the XZ plane"
                                >
                                    Swap to XZ
                                </button>
                            </div>
                        </div>
                        <div class="pattern-controls">
                            <div class="flip-controls">
                                <button
                                    class="toolbar-button flip-btn"
                                    data-plane="elevation-yz"
                                    data-axis="first"
                                    title="Mirror pattern around Y axis"
                                >
                                    Mirror Y
                                </button>
                                <button
                                    class="toolbar-button flip-btn"
                                    data-plane="elevation-yz"
                                    data-axis="second"
                                    title="Mirror pattern around Z axis"
                                >
                                    Mirror Z
                                </button>
                            </div>
                            <button
                                class="toolbar-button delete-btn"
                                data-plane="elevation-yz"
                                title="Delete this pattern"
                            >
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Left Toolbar -->
        <div class="tool-menu">
            <!-- Edit -->
            <button
                class="button"
                id="edit-btn"
                title="Add and edit antenna patterns"
            >
                <i class="bx bx-edit"></i>
            </button>

            <!-- Mounting Type -->
            <div class="dropdown-button">
                <button
                    class="button"
                    id="mount-btn"
                    title="Change the mounting type"
                >
                    <i class="bx bx-home"></i>
                </button>
                <div class="dropdown-menu" id="mount-menu">
                    <h4>Name</h4>
                    <input
                        type="text"
                        id="antenna-name"
                        class="antenna-name-input"
                        placeholder="Antenna name"
                    />
                    <h4>Mounting Type</h4>
                    <label>
                        <input
                            type="radio"
                            name="mount-type"
                            value="ceiling"
                            checked
                        />
                        Ceiling Mount
                    </label>
                    <label>
                        <input type="radio" name="mount-type" value="wall" />
                        Wall Mount
                    </label>
                    <label>
                        <input type="radio" name="mount-type" value="table" />
                        Table Mount
                    </label>
                </div>
            </div>

            <!-- Formfactor -->
            <div class="dropdown-button">
                <button
                    class="button"
                    id="model-btn"
                    title="Change the formfactor of the AP or antenna"
                >
                    <i class="bx bx-cube"></i>
                </button>
                <div class="dropdown-menu" id="model-menu">
                    <h4>Formfactor</h4>
                    <label>
                        <input type="radio" name="ap-model" value="none" />
                        None
                    </label>
                    <label>
                        <input
                            type="radio"
                            name="ap-model"
                            value="disc"
                            checked
                        />
                        Disc
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="squircle" />
                        Squircle
                    </label>
                    <label>
                        <input
                            type="radio"
                            name="ap-model"
                            value="hospitality"
                        />
                        Hospitality
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="can" />
                        Can
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="patch" />
                        Patch Panel
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="dipole" />
                        Dipole
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="tube" />
                        Tube
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="flat" />
                        Flat
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="standing" />
                        Standing
                    </label>
                    <label>
                        <input type="radio" name="ap-model" value="box" />
                        Box
                    </label>
                </div>
            </div>

            <!-- View -->
            <div class="dropdown-button">
                <button
                    class="button"
                    id="view-btn"
                    title="Show and hide chart elements"
                >
                    <i class="bx bx-show"></i>
                </button>
                <div class="dropdown-menu" id="view-menu">
                    <h4>Coordinate Axes</h4>
                    <label>
                        <input type="checkbox" id="show-world-axes" checked />
                        World Axes
                    </label>
                    <label>
                        <input type="checkbox" id="show-antenna-axes" checked />
                        Antenna Axes
                    </label>
                    <h4>Ground Plane</h4>
                    <label>
                        <input type="checkbox" id="show-ground-plane" checked />
                        Show Ground
                    </label>
                    <div class="slider-row">
                        <label>Height:</label>
                        <input
                            type="range"
                            id="ground-height"
                            min="-3"
                            max="0"
                            step="0.1"
                            value="-1.5"
                        />
                        <span id="ground-height-value">-1.5</span>
                    </div>
                    <h4>Planes</h4>
                    <label>
                        <input type="checkbox" id="show-azimuth" checked />
                        <span class="color-indicator azimuth"></span>
                        Azimuth (XY)
                    </label>
                    <label>
                        <input type="checkbox" id="show-elevation-xz" checked />
                        <span class="color-indicator elevation-xz"></span>
                        Elevation (XZ)
                    </label>
                    <label>
                        <input type="checkbox" id="show-elevation-yz" />
                        <span class="color-indicator elevation-yz"></span>
                        Elevation (YZ)
                    </label>
                    <h4>Gain Range</h4>
                    <div class="slider-row">
                        <label>Min:</label>
                        <input
                            type="range"
                            id="min-gain"
                            min="-40"
                            max="20"
                            step="5"
                            value="-30"
                        />
                        <span id="min-gain-value">-30 dB</span>
                    </div>
                    <div class="slider-row">
                        <label>Max:</label>
                        <input
                            type="range"
                            id="max-gain"
                            min="-40"
                            max="20"
                            step="5"
                            value="10"
                        />
                        <span id="max-gain-value">10 dB</span>
                    </div>
                </div>
            </div>

            <!-- Export -->
            <!-- Import -->
            <button
                class="button"
                id="import-btn"
                title="Import antenna pattern from file"
            >
                <i class="bx bx-upload"></i>
            </button>
            <input
                type="file"
                id="import-file-input"
                accept=".csv,.txt"
                style="display: none"
            />

            <button
                class="button"
                id="export-btn"
                title="Download a summary CSV file"
            >
                <i class="bx bx-download"></i>
            </button>

            <!-- Zoom In -->
            <button class="button" id="zoom-in-btn" title="Zoom In">
                <i class="bx bx-zoom-in"></i>
            </button>

            <!-- Zoom Out -->
            <button class="button" id="zoom-out-btn" title="Zoom Out">
                <i class="bx bx-zoom-out"></i>
            </button>
        </div>

        <div id="drop-overlay" class="drop-overlay">
            <div class="drop-overlay-message">
                Drop antenna pattern file to import
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
